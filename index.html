<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جرد الدورات وكسر الرتب</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        nav {
            display: flex;
            gap: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background-color: var(--accent);
            color: white;
        }

        .nav-btn:hover:not(.active) {
            background-color: var(--border);
            color: var(--text-main);
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        h1, h2 {
            margin-bottom: 1.5rem;
        }

        .grid-courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .course-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }

        .course-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--text-main);
            resize: vertical;
            font-family: monospace;
            direction: ltr;
        }

        textarea:focus {
            outline: 2px solid var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .actions-bar {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        select {
            width: 100%;
            max-width: 300px;
            padding: 0.5rem 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 0.5rem;
            font-size: 0.95rem;
        }

        .user-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .user-id-box {
            font-family: monospace;
            background-color: var(--bg-color);
            padding: 0.3rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 1rem;
        }

        .rank-selector-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .badge-success { background-color: var(--success); color: white; }
        .badge-danger { background-color: var(--danger); color: white; }

        .break-command-box {
            background-color: var(--bg-color);
            border: 1px dashed var(--danger);
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .break-command-text {
            font-family: monospace;
            color: #fca5a5;
            direction: ltr;
            text-align: left;
            word-break: break-all;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            overflow: hidden;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--accent);
        }

        .copy-btn {
            background-color: var(--accent);
            border: none;
            color: white;
            padding: 0.35rem 0.75rem;
            border-radius: 0.35rem;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <button class="nav-btn active" onclick="showPage('page1', event)">1. جرد الدورات</button>
            <button class="nav-btn" onclick="showPage('page2', event)">2. فحص واستعلام الرتب والكسر</button>
            <button class="nav-btn" onclick="showPage('page3', event)">3. التقرير الشامل</button>
        </nav>
    </header>

    <main>
        <!-- الصفحة الأولى: إدخال الدورات -->
        <section id="page1" class="page active">
            <h2>إدخال وتحديث جرد الدورات</h2>
            <div class="grid-courses">
                <div class="course-card">
                    <h3>فرد أساس</h3>
                    <textarea id="c_basic" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>مركز عمليات</h3>
                    <textarea id="c_ops" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>إسعافات أولية</h3>
                    <textarea id="c_firstaid" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>تأهيل ضباط</h3>
                    <textarea id="c_officer" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>مظلات مشتركة</h3>
                    <textarea id="c_parachute" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>صاعقة</h3>
                    <textarea id="c_thunder" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>ضفادع</h3>
                    <textarea id="c_frogs" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
                <div class="course-card">
                    <h3>صقور جوية</h3>
                    <textarea id="c_falcons" placeholder="ضع المنشنات هنا..."></textarea>
                </div>
            </div>
            <div class="actions-bar">
                <button class="btn" onclick="saveCourses()">حفظ البيانات</button>
                <button class="btn btn-danger" onclick="clearData()">تفريغ البيانات بالكامل</button>
            </div>
        </section>

        <!-- الصفحة الثانية: الفحص وكسر الرتب -->
        <section id="page2" class="page">
            <h2>فحص واستعلام الرتب والكسر</h2>
            
            <div class="form-group">
                <label>أدخل قائمة المنشنات أو الإيديات للبحث:</label>
                <textarea id="search_users" placeholder="1. <@755202816187826318>&#10;2. 938254436671840256"></textarea>
            </div>

            <button class="btn" onclick="processSearch()">عرض واستعلام الأشخاص</button>

            <div id="search_results" style="margin-top: 1.5rem;"></div>
        </section>

        <!-- الصفحة الثالثة: التقرير الشامل -->
        <section id="page3" class="page">
            <h2>التقرير الشامل والبيانات الحالية</h2>
            <p style="color: var(--text-muted); margin-bottom: 1rem;">عرض قائمة مفصلة بكل الإيديات المسجلة وحالات الدورات</p>
            
            <button class="btn" onclick="renderReport()">تحديث التقرير</button>
            
            <div id="report_container"></div>
        </section>
    </main>

    <script>
        const DEMOTION_ROLES = {
            "رئيس رقباء": "1450494016843022521",
            "ملازم": "1450494015635193948",
            "نقيب": "1450494013202501745",
            "رائد": "1450494012300464329"
        };

        const COURSES_KEYS = [
            'c_basic', 'c_ops', 'c_firstaid', 'c_officer', 
            'c_parachute', 'c_thunder', 'c_frogs', 'c_falcons'
        ];

        const COURSE_NAMES = {
            'c_basic': 'فرد أساس',
            'c_ops': 'مركز عمليات',
            'c_firstaid': 'إسعافات أولية',
            'c_officer': 'تأهيل ضباط',
            'c_parachute': 'مظلات مشتركة',
            'c_thunder': 'صاعقة',
            'c_frogs': 'ضفادع',
            'c_falcons': 'صقور جوية'
        };

        const RANKS_LIST = [
            "اختر الرتبة الحالية...",
            "فريق اول", "فريق", "لواء", "عميد", "عقيد", 
            "مقدم", "رائد", "نقيب", "ملازم اول", "ملازم"
        ];

        function extractUserIds(text) {
            const regex = /\b\d{17,19}\b/g;
            const matches = text.match(regex);
            return matches ? [...new Set(matches)] : [];
        }

        function saveCourses() {
            const data = {};
            COURSES_KEYS.forEach(key => {
                const text = document.getElementById(key).value;
                data[key] = extractUserIds(text);
            });
            localStorage.setItem('military_courses_data', JSON.stringify(data));
            alert('تم حفظ بيانات الدورات بنجاح!');
        }

        function loadCourses() {
            const data = JSON.parse(localStorage.getItem('military_courses_data') || '{}');
            COURSES_KEYS.forEach(key => {
                if (data[key]) {
                    document.getElementById(key).value = data[key].map(id => `<@${id}>`).join('\n');
                }
            });
        }

        function clearData() {
            if (confirm('هل أنت تأكد من مسح جميع البيانات المخزنة في المتصفح؟')) {
                localStorage.removeItem('military_courses_data');
                COURSES_KEYS.forEach(key => document.getElementById(key).value = '');
                alert('تم مسح البيانات.');
            }
        }

        function showPage(pageId, evt) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }

            if (pageId === 'page3') {
                renderReport();
            }
        }

        function getUserCourses(userId) {
            const data = JSON.parse(localStorage.getItem('military_courses_data') || '{}');
            const userCourses = [];
            COURSES_KEYS.forEach(key => {
                if (data[key] && data[key].includes(userId)) {
                    userCourses.push(key);
                }
            });
            return userCourses;
        }

        // شروط الكسر وحساب الأدوار
        function calculateDemotion(currentRank, userCourses) {
            if (!currentRank || currentRank.includes("اختر")) {
                return { demoted: false, targetRank: null, roleId: null, reason: "يرجى اختيار رتبة الشخص أولاً" };
            }

            const hasBasic = userCourses.includes('c_basic');
            const hasOps = userCourses.includes('c_ops');
            const hasOfficer = userCourses.includes('c_officer');
            const hasFirstAid = userCourses.includes('c_firstaid');
            const hasParachute = userCourses.includes('c_parachute');
            const hasThunder = userCourses.includes('c_thunder');
            const hasFrogs = userCourses.includes('c_frogs');
            const hasFalcons = userCourses.includes('c_falcons');

            // 1. الدورات الأساسية -> رئيس رقباء
            if (!hasBasic || !hasOps || !hasOfficer || !hasFirstAid) {
                const missingBasic = [];
                if (!hasBasic) missingBasic.push('فرد أساس');
                if (!hasOps) missingBasic.push('مركز عمليات');
                if (!hasOfficer) missingBasic.push('تأهيل ضباط');
                if (!hasFirstAid) missingBasic.push('إسعافات أولية');

                return {
                    demoted: true,
                    targetRank: "رئيس رقباء",
                    roleId: DEMOTION_ROLES["رئيس رقباء"],
                    reason: `نقص في الدورات الأساسية (${missingBasic.join('، ')})`
                };
            }

            // 2. مظلات مشتركة -> ملازم
            if (!hasParachute) {
                return {
                    demoted: true,
                    targetRank: "ملازم",
                    roleId: DEMOTION_ROLES["ملازم"],
                    reason: "نقص دورة مظلات مشتركة"
                };
            }

            // 3. لا يوجد صاعقة ولا ضفادع -> نقيب
            if (!hasThunder && !hasFrogs) {
                return {
                    demoted: true,
                    targetRank: "نقيب",
                    roleId: DEMOTION_ROLES["نقيب"],
                    reason: "عدم وجود دورة صاعقة ولا ضفادع"
                };
            }

            // 4. نقص صقور جوية -> رائد
            if (!hasFalcons) {
                return {
                    demoted: true,
                    targetRank: "رائد",
                    roleId: DEMOTION_ROLES["رائد"],
                    reason: "نقص دورة صقور جوية"
                };
            }

            return { demoted: false, targetRank: currentRank, roleId: null, reason: "مستوفٍ لكافة الدورات المطلوبة" };
        }

        // توليد خيارات الرتب
        function getRankOptionsHTML(selectedRank = "") {
            return RANKS_LIST.map(r => `<option value="${r}" ${r === selectedRank ? 'selected' : ''}>${r}</option>`).join('');
        }

        // عرض مربعات المستعلم عنهم
        function processSearch() {
            const rawText = document.getElementById('search_users').value;
            const userIds = extractUserIds(rawText);
            const container = document.getElementById('search_results');

            if (userIds.length === 0) {
                container.innerHTML = '<p style="color:var(--danger)">لم يتم العثور على أرقام ID صالحة.</p>';
                return;
            }

            let html = '';

            userIds.forEach(id => {
                const userCourses = getUserCourses(id);
                const courseNamesList = userCourses.map(k => COURSE_NAMES[k]).join(' - ') || 'لا توجد دورات مسجلة';

                html += `
                    <div class="user-card" id="card_${id}">
                        <div class="user-card-header">
                            <div>
                                <strong>المستخدم:</strong> <span class="user-id-box">&lt;@${id}&gt;</span>
                            </div>
                            <div class="rank-selector-group">
                                <label for="rank_${id}">الرتبة الحالية:</label>
                                <select id="rank_${id}" onchange="updateUserStatus('${id}')">
                                    ${getRankOptionsHTML()}
                                </select>
                            </div>
                        </div>

                        <div>
                            <p><strong>الدورات المسجلة له (${userCourses.length} من 8):</strong> ${courseNamesList}</p>
                        </div>

                        <div id="status_box_${id}">
                            <p style="color: var(--text-muted); font-size: 0.9rem;">اختر رتبته من الأعلى لبدء الفحص والكسر...</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // تحديث حالة الفحص لكل شخص فور تغيير رتبته
        function updateUserStatus(userId) {
            const selectedRank = document.getElementById(`rank_${userId}`).value;
            const userCourses = getUserCourses(userId);
            const statusBox = document.getElementById(`status_box_${userId}`);
            const result = calculateDemotion(selectedRank, userCourses);

            if (!result.targetRank && !result.demoted) {
                statusBox.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">اختر رتبته من الأعلى لبدء الفحص والكسر...</p>';
                return;
            }

            if (result.demoted) {
                const breakCommand = `<@${userId}> يتم كسره إلى <@&${result.roleId}> بسبب عدم اكمال الدورات`;
                statusBox.innerHTML = `
                    <p style="margin-bottom:0.5rem;">
                        <strong>حالة الدورات والكسر:</strong> 
                        <span class="badge badge-danger">يتم كسره إلى ${result.targetRank}</span>
                        <span style="color: var(--text-muted); font-size:0.9rem; margin-right: 0.5rem;">(السبب: ${result.reason})</span>
                    </p>
                    <div class="break-command-box">
                        <span class="break-command-text">${breakCommand}</span>
                        <button class="copy-btn" onclick="navigator.clipboard.writeText('${breakCommand}')">نسخ الأمر</button>
                    </div>
                `;
            } else {
                statusBox.innerHTML = `
                    <p>
                        <strong>حالة الدورات والكسر:</strong> 
                        <span class="badge badge-success">سليم ومستوف لشروط رتبة (${selectedRank})</span>
                    </p>
                `;
            }
        }

        function renderReport() {
            const data = JSON.parse(localStorage.getItem('military_courses_data') || '{}');
            let allUsers = [];

            COURSES_KEYS.forEach(key => {
                if (data[key]) {
                    allUsers = allUsers.concat(data[key]);
                }
            });

            allUsers = [...new Set(allUsers)];
            const container = document.getElementById('report_container');

            if (allUsers.length === 0) {
                container.innerHTML = '<p style="margin-top:1rem;">لا توجد أي بيانات مدخلة في الجرد حتى الآن.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>الـ User ID</th>
                            <th>المنشن</th>
                            <th>عدد الدورات</th>
                            <th>الدورات المسجلة</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            allUsers.forEach(id => {
                const userCourses = getUserCourses(id);
                const names = userCourses.map(k => COURSE_NAMES[k]).join(', ');
                html += `
                    <tr>
                        <td><code>${id}</code></td>
                        <td>&lt;@${id}&gt;</td>
                        <td>${userCourses.length} / 8</td>
                        <td>${names}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        window.onload = loadCourses;
    </script>
</body>
</html>
